# ---------------------------------------------------------------------------
# Cranberry Canvas — a Home Assistant theme
# Palette: Cranberry #591E21 · Canvas #E3DDCF · Olive #514718 · Quail #7D8689
#
# Install
#   1. Save this file as  /config/themes/cranberry_canvas.yaml
#   2. In configuration.yaml:
#        frontend:
#          themes: !include_dir_merge_named themes
#   3. Restart Home Assistant (or run the action  frontend.reload_themes)
#   4. Profile → Theme → "Cranberry Canvas"
#
# Fonts: loaded automatically by the Cranberry home card. Without that card,
#   add them yourself: Settings → Dashboards → ⋮ → Resources → Add resource
#     URL:  https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,400..600,100&family=Figtree:wght@400;500;600;700&display=swap
#     Type: Stylesheet
#
# Colour rules (same as the design):
#   cranberry = lights / scenes on      olive  = fine & running (locked, armed, heating, playing)
#   quail     = off / idle              brick  = only when something needs you
#
# Version 3: also themes Home Assistant's own interface (buttons, dialogs,
#   forms, chips, tooltips, tables, code editor, graphs) through its colour
#   scales, so settings pages and more-info windows match the dashboard.
# ---------------------------------------------------------------------------

Cranberry Canvas:

  # ---------- Shared by light and dark ----------
  # Shape: rounded, not circular; no hard shadows
  # Three corner sizes everywhere: cards, controls (buttons, icon squares), small chips
  cc-r-card: "24px"
  cc-r-ctl: "12px"
  cc-r-chip: "8px"
  ha-card-border-radius: "24px"
  ha-card-border-width: "0px"
  ha-card-box-shadow: "none"
  ha-badge-border-radius: "12px"
  ha-tile-icon-border-radius: "12px"
  ha-control-border-radius: "12px"
  masonry-view-card-margin: "6px 8px"
  grid-card-gap: "12px"

  # Typography: soft serif for headings, Figtree for everything else
  ha-font-family-body: "Figtree, system-ui, sans-serif"
  ha-font-family-heading: "Fraunces, Georgia, serif"
  primary-font-family: "Figtree, system-ui, sans-serif"
  paper-font-common-base_-_font-family: "Figtree, system-ui, sans-serif"
  ha-font-weight-bold: "600"

  # Bubble Card shapes
  bubble-border-radius: "24px"
  bubble-button-border-radius: "24px"
  bubble-icon-border-radius: "12px"
  bubble-button-icon-border-radius: "12px"
  bubble-sub-button-border-radius: "12px"
  bubble-pop-up-border-radius: "32px"
  bubble-media-player-border-radius: "24px"
  bubble-media-player-buttons-border-radius: "12px"
  bubble-media-player-icon-border-radius: "12px"
  bubble-horizontal-buttons-stack-border-radius: "24px"
  bubble-box-shadow: "none"
  bubble-button-box-shadow: "none"
  bubble-media-player-box-shadow: "none"
  bubble-border: "none"

  # Home Assistant's own controls: same corners as the cards
  ha-button-border-radius: "12px"          # buttons in dialogs, settings and more-info
  ha-dialog-border-radius: "24px"
  ha-tooltip-border-radius: "8px"
  ha-tooltip-arrow-size: "0px"
  ha-tooltip-box-shadow: "0 6px 20px rgba(35, 28, 26, 0.18)"
  dialog-box-shadow: "0 16px 48px rgba(35, 28, 26, 0.24)"
  ha-box-shadow-m: "0 6px 20px rgba(35, 28, 26, 0.14)"
  ha-box-shadow-l: "0 16px 48px rgba(35, 28, 26, 0.24)"
  app-header-border-bottom: "none"
  ha-dialog-scrim-backdrop-filter: "brightness(80%) blur(2px)"

